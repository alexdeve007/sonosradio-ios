name: SonosRadio
options:
  bundleIdPrefix: com.sonosradio
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SonosRadio:
    type: application
    platform: iOS
    sources:
      - SonosRadio
    info:
      path: SonosRadio/Info.plist
      properties:
        CFBundleDisplayName: SonosRadio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "SonosRadio needs local network access to discover and control your Sonos speakers."
        NSBonjourServices:
          - "_sonos._tcp"
        UILaunchScreen: {}
    entitlements:
      path: SonosRadio/SonosRadio.entitlements
      properties:
        com.apple.developer.networking.multicast: true
  SonosRadioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SonosRadioTests
    dependencies:
      - target: SonosRadio
